services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: slotsure
      POSTGRES_USER: slotsure
      POSTGRES_PASSWORD: slotsure_dev_password
    ports:
      - "5432:5432"
    volumes:
      - slotsure-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotsure -d slotsure"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  slotsure-postgres:
